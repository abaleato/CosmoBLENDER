[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmoblender"
version = "1.0.0"
description = "CosmoBLENDER: Cosmological Biases to LENsing and Delensing due to Extragalactic Radiation"
readme = "README_PyPI.md"
authors = [{ name = "Anton Baleato Lizancos", email = "a.baleatolizancos@berkeley.edu" }]
license = "CC-BY-NC-SA-3.0"
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Intended Audience :: Science/Research",
]
keywords = ["cmb", "lensing", "delensing", "cosmology", "halo-model"]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "astropy",
    "healpy",
    "hmvec",
    "quicklens"
]
requires-python = ">=3.9"

[project.optional-dependencies]
fftlog = ["pyccl"]

[project.urls]
Homepage = "https://github.com/abaleato/CosmoBLENDER"
Repository = "https://github.com/abaleato/CosmoBLENDER"
Issues = "https://github.com/abaleato/CosmoBLENDER/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]